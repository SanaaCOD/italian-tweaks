<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kojo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-bg" aria-hidden="true">
      <img class="app-bg__image" src="../../assets/background-galaxy.png" alt="" />
      <div class="app-bg__overlay"></div>
      <div class="app-bg__vignette"></div>
    </div>

    <aside class="sidebar" aria-label="Navigation principale">
      <header class="sidebar__brand">
        <img class="sidebar__logo" src="../../assets/logo.png" alt="Kojo" width="120" height="40" />
        <div class="sidebar__titles">
          <span class="sidebar__name">Kojo</span>
          <span class="sidebar__tagline">Performance Suite</span>
        </div>
      </header>

      <nav class="sidebar__nav" id="sidebar-nav"></nav>

      <footer class="sidebar__footer">
        <p class="sidebar__build-id" id="sidebar-build-id" title="Identification build">Chargement…</p>
        <p class="sidebar__dev-hint" id="sidebar-dev-hint" hidden></p>
        <button type="button" class="sidebar__update-btn" id="sidebar-check-update">Check update</button>
      </footer>
    </aside>

    <main class="main" id="main-content" role="main"></main>
  </div>

  <script src="ui.js" defer></script>
  <script src="page-cache.js" defer></script>
  <script src="page-loader.js" defer></script>
  <script src="api.js" defer></script>
  <script src="pages.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
